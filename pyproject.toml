[project]
name = "protocolos"
version = "0.1.0"
description = "ProtocolOS (formerly TrialLens): a rationale reviewer and drafter for clinical-trial eligibility criteria. Every exclusion deserves a rationale."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pypdf>=6.21.1",
    "pdfminer.six>=20260107",
    "pydantic>=2.14.1",
    "anthropic>=1.15.0",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pyright]
ignore = ["."]


[tool.mypy]
ignore_errors = true


[tool.ty.rules]
all = "ignore"


[tool.pytest.ini_options]
pythonpath = ["."]
